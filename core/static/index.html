<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chotu Control Panel</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      background: #0d0d0d;
      color: #d4d4d4;
      font-family: monospace;
      font-size: 13px;
    }

    /* ── Top layout ─────────────────────────────────────── */
    .layout {
      display: flex;
      height: 100vh;
      width: 100vw;
    }

    /* ── LEFT PANE ───────────────────────────────────────── */
    .left-pane {
      width: 40%;
      min-width: 320px;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #333;
    }

    /* Tabs */
    .tabs {
      display: flex;
      border-bottom: 1px solid #333;
      flex-shrink: 0;
    }

    .tab {
      padding: 6px 18px;
      cursor: pointer;
      border-right: 1px solid #333;
      background: transparent;
      color: #888;
      font-family: monospace;
      font-size: 13px;
      border-top: none;
      border-left: none;
      border-bottom: none;
      outline: none;
    }

    .tab:last-child {
      border-right: none;
    }

    .tab.active {
      background: #d4d4d4;
      color: #0d0d0d;
    }

    /* Tab content panels */
    .tab-panel {
      display: none;
      flex: 1;
      overflow: hidden;
      flex-direction: column;
    }

    .tab-panel.active {
      display: flex;
    }

    /* Event log */
    .event-log {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      line-height: 1.7;
    }

    .event-log::-webkit-scrollbar {
      width: 6px;
    }

    .event-log::-webkit-scrollbar-track {
      background: #0d0d0d;
    }

    .event-log::-webkit-scrollbar-thumb {
      background: #333;
    }

    /* Event row styles */
    .ev { padding: 2px 0; border-bottom: 1px solid #1a1a1a; word-break: break-word; }
    .ev-user     { color: #d4d4d4; }
    .ev-think    { color: #6b9bd2; }
    .ev-monologue { color: #aaaaaa; font-style: italic; }
    .ev-speak    { color: #7ec87e; }
    .ev-tool     { color: #888; }
    .ev-estop    { color: #e06c75; }
    .ev-mode     { color: #c678dd; }

    /* Legacy event classes (kept for compatibility) */
    .event { margin-bottom: 2px; }
    .event-user   { color: #d4d4d4; }
    .event-think  { color: #6b9bd2; }
    .event-tool   { color: #888; }
    .event-speak  { color: #7ec87e; }

    /* Gallery grid */
    .gallery-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      padding: 10px;
      overflow-y: auto;
      flex: 1;
    }

    .gallery-grid::-webkit-scrollbar {
      width: 6px;
    }

    .gallery-grid::-webkit-scrollbar-track {
      background: #0d0d0d;
    }

    .gallery-grid::-webkit-scrollbar-thumb {
      background: #333;
    }

    .gallery-thumb {
      border: 1px solid #333;
      aspect-ratio: 4 / 3;
      background: #1a1a1a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #555;
      font-size: 11px;
      gap: 6px;
    }

    .gallery-thumb .thumb-icon {
      font-size: 22px;
      color: #333;
    }

    .gallery-item {
      border: 1px solid #333;
      background: #1a1a1a;
      overflow: hidden;
    }

    .gallery-label {
      padding: 4px 6px;
      color: #666;
      font-size: 11px;
      border-top: 1px solid #222;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .gallery-empty {
      grid-column: 1 / -1;
      text-align: center;
      color: #444;
      padding: 40px 0;
    }

    /* Mode controls */
    .controls-bar {
      border-top: 1px solid #333;
      padding: 8px 10px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .controls-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .controls-label {
      color: #888;
      white-space: nowrap;
    }

    .mode-select {
      background: #0d0d0d;
      color: #d4d4d4;
      border: 1px solid #333;
      font-family: monospace;
      font-size: 13px;
      padding: 2px 6px;
      outline: none;
      cursor: pointer;
    }

    .mode-select option {
      background: #0d0d0d;
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #888;
      cursor: pointer;
      user-select: none;
    }

    .checkbox-label input[type="checkbox"] {
      accent-color: #d4d4d4;
      cursor: pointer;
    }

    #goal-input {
      flex: 1;
      background: #0d0d0d;
      color: #d4d4d4;
      border: 1px solid #333;
      font-family: monospace;
      font-size: 13px;
      padding: 2px 6px;
      outline: none;
      min-width: 0;
    }

    #goal-input::placeholder {
      color: #444;
    }

    /* Input bar */
    .input-bar {
      border-top: 1px solid #333;
      display: flex;
      flex-shrink: 0;
    }

    .input-field {
      flex: 1;
      background: #0d0d0d;
      color: #d4d4d4;
      border: none;
      font-family: monospace;
      font-size: 13px;
      padding: 8px 10px;
      outline: none;
    }

    .input-field::placeholder {
      color: #444;
    }

    .send-btn {
      background: transparent;
      border: none;
      border-left: 1px solid #333;
      color: #888;
      font-family: monospace;
      font-size: 13px;
      padding: 8px 14px;
      cursor: pointer;
      white-space: nowrap;
    }

    .send-btn:hover {
      color: #d4d4d4;
      background: #1a1a1a;
    }

    /* ── RIGHT PANE ──────────────────────────────────────── */
    .right-pane {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 10px;
      gap: 10px;
      overflow: hidden;
    }

    /* Camera feed */
    .camera-block {
      border: 1px solid #333;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111;
      color: #444;
      font-size: 12px;
      position: relative;
      min-height: 0;
      overflow: hidden;
    }

    .camera-label {
      text-align: center;
      line-height: 1.8;
    }

    .battery-overlay {
      position: absolute;
      bottom: 8px;
      right: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(0,0,0,0.55);
      border-radius: 4px;
      padding: 3px 7px;
      font-size: 11px;
      color: #ccc;
      pointer-events: none;
    }

    .battery-bar {
      display: flex;
      gap: 2px;
      align-items: center;
    }

    .battery-seg {
      width: 6px;
      height: 10px;
      background: #2a2a2a;
      border-radius: 1px;
    }

    .battery-seg.filled-green  { background: #4caf50; }
    .battery-seg.filled-yellow { background: #ffc107; }
    .battery-seg.filled-red    { background: #f44336; }

    #battery-volt {
      font-variant-numeric: tabular-nums;
      color: #aaa;
    }
    #battery-volt.sag {
      color: #ff5252;
      animation: sag-flash 0.6s ease-in-out infinite alternate;
    }
    @keyframes sag-flash {
      from { opacity: 1; }
      to   { opacity: 0.45; }
    }

    .camera-label .url {
      color: #333;
      font-size: 11px;
    }

    /* Perception block */
    .perception-block {
      border: 1px solid #333;
      flex-shrink: 0;
    }

    .perception-header {
      border-bottom: 1px solid #333;
      padding: 4px 10px;
      color: #888;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .perception-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      padding: 8px 10px;
      gap: 4px 20px;
    }

    .perception-row {
      display: flex;
      gap: 6px;
      align-items: baseline;
    }

    .perception-key {
      color: #555;
      white-space: nowrap;
      min-width: 60px;
    }

    .perception-val {
      color: #888;
    }

    .perception-val.none {
      color: #3a3a3a;
    }
  </style>
</head>
<body>

<div class="layout">

  <!-- ── LEFT PANE ──────────────────────────────────────── -->
  <div class="left-pane">

    <!-- Tabs -->
    <div class="tabs">
      <button class="tab active" onclick="switchTab('chat', this)">Chat</button>
      <button class="tab" onclick="switchTab('gallery', this)">Gallery</button>
    </div>

    <!-- Chat panel -->
    <div class="tab-panel active" id="panel-chat">
      <div class="event-log" id="event-log">
      </div>
    </div>

    <!-- Gallery panel -->
    <div class="tab-panel" id="panel-gallery">
      <div class="gallery-grid" id="gallery-grid">
        <div class="gallery-empty" id="gallery-empty">No images yet</div>
      </div>
    </div>

    <!-- Mode controls -->
    <div class="controls-bar">
      <div class="controls-row">
        <span class="controls-label">Mode:</span>
        <select class="mode-select" id="mode-select">
          <option value="reactive">reactive</option>
          <option value="goal">goal</option>
        </select>
        <input id="goal-input" type="text" placeholder="enter goal..." style="display:none;">
      </div>
      <div class="controls-row">
        <label class="checkbox-label">
          <input type="checkbox" id="thinking-checkbox"> thinking
        </label>
        <label class="checkbox-label">
          <input type="checkbox" id="continuous-checkbox"> continuous
        </label>
      </div>
    </div>

    <!-- Input bar -->
    <div class="input-bar">
      <input
        class="input-field"
        type="text"
        placeholder="&gt; type a command..."
        id="input-field"
        onkeydown="handleKey(event)"
      >
      <button class="send-btn" onclick="sendInput()">send</button>
    </div>

  </div>

  <!-- ── RIGHT PANE ─────────────────────────────────────── -->
  <div class="right-pane">

    <!-- Camera feed -->
    <div class="camera-block">
      <img id="camera-stream" src="/stream" alt="camera feed"
           style="width:100%;height:100%;object-fit:contain;display:block;">
      <div class="battery-overlay" id="battery-overlay">
        <div class="battery-bar" id="battery-bar">
          <div class="battery-seg" id="bat-s0"></div>
          <div class="battery-seg" id="bat-s1"></div>
          <div class="battery-seg" id="bat-s2"></div>
          <div class="battery-seg" id="bat-s3"></div>
          <div class="battery-seg" id="bat-s4"></div>
        </div>
        <span id="battery-pct">—</span>
        <span id="battery-volt">—V</span>
      </div>
    </div>

    <!-- Perception / vilib tags -->
    <div class="perception-block">
      <div class="perception-header">Perception / Vilib Tags</div>
      <div class="perception-grid">
        <div class="perception-row">
          <span class="perception-key">face:</span>
          <span class="perception-val none" id="perc-face">—</span>
        </div>
        <div class="perception-row">
          <span class="perception-key">human:</span>
          <span class="perception-val none" id="perc-human">—</span>
        </div>
      </div>
    </div>

  </div>

</div>

<script>
  // ── Tab switching ─────────────────────────────────────────
  var galleryLoaded = false;
  var pendingGalleryImages = []; // SSE images queued while gallery tab is inactive

  function switchTab(name, btn) {
    document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
    document.querySelectorAll('.tab-panel').forEach(function(p) { p.classList.remove('active'); });
    btn.classList.add('active');
    document.getElementById('panel-' + name).classList.add('active');

    if (name === 'gallery') {
      loadGallery();
    }
  }

  // ── Chat input ────────────────────────────────────────────
  function handleKey(e) {
    if (e.key === 'Enter') sendInput();
  }

  function sendInput() {
    var field = document.getElementById('input-field');
    var text = field.value.trim();
    if (!text) return;
    field.value = '';
    fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: text })
    }).catch(function(err) {
      appendEvent('ev-tool', '[chat error] ' + err.message);
    });
  }

  // ── Append event row ──────────────────────────────────────
  function appendEvent(cls, text) {
    var log = document.getElementById('event-log');
    var div = document.createElement('div');
    div.className = 'ev ' + cls;
    div.textContent = text;
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
  }

  // ── SSE event stream ──────────────────────────────────────
  var _sseConnected = false;

  function connectSSE() {
    var es = new EventSource('/events');

    es.onopen = function() {
      if (!_sseConnected) {
        _sseConnected = true;
      } else {
        appendEvent('ev-mode', '[stream] reconnected');
      }
    };

    es.onmessage = function(event) {
      var data;
      try {
        data = JSON.parse(event.data);
      } catch(e) {
        return;
      }

      var type = data.type;
      if (type === 'ping') return;

      if (type === 'user') {
        appendEvent('ev-user', '[user] ' + data.text);
      } else if (type === 'think') {
        appendEvent('ev-think', '[think] ' + data.text);
      } else if (type === 'monologue') {
        appendEvent('ev-monologue', '[thinks] ' + data.text);
      } else if (type === 'speak') {
        appendEvent('ev-speak', '[speak] "' + data.text + '"');
      } else if (type === 'tool_call') {
        var msg;
        if (data.ok) {
          msg = '[' + data.tool + '] ok=' + data.ok + ' ' + data.ms + 'ms';
        } else {
          msg = '[' + data.tool + '] ok=false error=' + (data.error || '?');
        }
        appendEvent('ev-tool', msg);
      } else if (type === 'image') {
        var item = makeGalleryItem(data.label, data.image_b64);
        var galleryPanel = document.getElementById('panel-gallery');
        if (galleryPanel.classList.contains('active')) {
          addGalleryItem(item);
        } else {
          pendingGalleryImages.push(item);
        }
      } else if (type === 'estop') {
        appendEvent('ev-estop', '[estop] ' + data.state + ' at ' + data.cm + 'cm');
      } else if (type === 'mode') {
        appendEvent('ev-mode', '[mode] switched to ' + data.mode);
      } else if (type === 'battery') {
        applyBattery(data.percent, data.voltage);
      }
    };

    es.onerror = function(e) {
      appendEvent('ev-estop', '[stream] disconnected — reconnecting...');
      es.close();
      setTimeout(connectSSE, 3000);
    };
  }

  connectSSE();

  // ── Mode dropdown ─────────────────────────────────────────
  var modeSelect = document.getElementById('mode-select');
  var goalInput = document.getElementById('goal-input');

  modeSelect.addEventListener('change', function() {
    var mode = modeSelect.value;
    if (mode === 'goal') {
      goalInput.style.display = '';
      goalInput.focus();
    } else {
      goalInput.style.display = 'none';
      fetch('/mode', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ mode: 'reactive' })
      }).catch(function() {});
    }
  });

  goalInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      var goalText = goalInput.value.trim();
      if (!goalText) return;
      fetch('/mode', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ mode: 'goal', goal_text: goalText })
      }).catch(function() {});
      goalInput.value = '';
    }
    if (e.key === 'Escape') {
      modeSelect.value = 'reactive';
      goalInput.style.display = 'none';
      fetch('/mode', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ mode: 'reactive' })
      }).catch(function() {});
    }
  });

  // ── Thinking checkbox ─────────────────────────────────────
  var thinkingCb = document.getElementById('thinking-checkbox');
  thinkingCb.addEventListener('change', function() {
    fetch('/thinking', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ enabled: thinkingCb.checked })
    }).catch(function() {});
  });

  // ── Continuous conversation checkbox ──────────────────────
  var continuousCb = document.getElementById('continuous-checkbox');
  continuousCb.addEventListener('change', function() {
    fetch('/stt', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ enabled: continuousCb.checked })
    }).catch(function() {});
  });

  // ── Perception polling ────────────────────────────────────
  function updatePerception() {
    fetch('/api/perception').then(function(r) {
      return r.json();
    }).then(function(data) {
      var result = (data && data.result) ? data.result : null;

      var faceEl = document.getElementById('perc-face');
      var humanEl = document.getElementById('perc-human');

      if (!result) {
        faceEl.textContent = '—';
        faceEl.className = 'perception-val none';
        humanEl.textContent = '—';
        humanEl.className = 'perception-val none';
        return;
      }

      var faceDetected = result.face && result.face.detected;
      faceEl.textContent = faceDetected ? 'detected' : 'not detected';
      faceEl.className = 'perception-val' + (faceDetected ? '' : ' none');

      var humanDetected = result.human && result.human.detected;
      humanEl.textContent = humanDetected ? 'detected' : 'not detected';
      humanEl.className = 'perception-val' + (humanDetected ? '' : ' none');
    }).catch(function() {
      // Leave last known values on error — don't blank them
    });
  }

  updatePerception();
  setInterval(updatePerception, 2000);

  // ── Battery overlay ───────────────────────────────────────
  // Driven by SSE 'battery' events (every BATTERY_POLL_INTERVAL on the brain).
  // Initial value still fetched once via /api/battery so the UI isn't blank
  // before the first SSE tick lands.
  var voltHistory = [];  // ring buffer of {t,v} for last ~30s; used as sag baseline
  var SAG_WINDOW_MS = 30000;
  var SAG_DROP_V = 0.4;

  function applyBattery(pct, voltage) {
    var pctEl = document.getElementById('battery-pct');
    var vEl = document.getElementById('battery-volt');
    if (pct == null || voltage == null) {
      pctEl.textContent = '—';
      vEl.textContent = '—V';
      vEl.classList.remove('sag');
      for (var i = 0; i < 5; i++) {
        document.getElementById('bat-s' + i).className = 'battery-seg';
      }
      return;
    }
    var pctRounded = Math.round(pct);
    pctEl.textContent = pctRounded + '%';
    vEl.textContent = voltage.toFixed(2) + 'V';
    var filled = Math.round(pctRounded / 20);
    var cls = pctRounded >= 50 ? 'filled-green' : pctRounded >= 20 ? 'filled-yellow' : 'filled-red';
    for (var j = 0; j < 5; j++) {
      document.getElementById('bat-s' + j).className = 'battery-seg' + (j < filled ? ' ' + cls : '');
    }

    // Sag detection: voltage dropped >SAG_DROP_V from the max seen in the last SAG_WINDOW_MS.
    var now = Date.now();
    voltHistory.push({ t: now, v: voltage });
    while (voltHistory.length && now - voltHistory[0].t > SAG_WINDOW_MS) {
      voltHistory.shift();
    }
    var baseline = voltHistory.reduce(function(m, x) { return x.v > m ? x.v : m; }, 0);
    if (baseline - voltage >= SAG_DROP_V) {
      vEl.classList.add('sag');
    } else {
      vEl.classList.remove('sag');
    }
  }

  function bootstrapBattery() {
    fetch('/api/battery').then(function(r) { return r.json(); }).then(function(data) {
      if (data && data.ok) {
        applyBattery(data.result.percent, data.result.voltage);
      }
    }).catch(function() {});
  }
  bootstrapBattery();

  // ── Gallery ───────────────────────────────────────────────
  function makeGalleryItem(label, image_b64) {
    var item = document.createElement('div');
    item.className = 'gallery-item';

    var img = document.createElement('img');
    img.src = 'data:image/jpeg;base64,' + image_b64;
    img.style.cssText = 'width:100%;display:block;';
    img.alt = label;

    var lbl = document.createElement('div');
    lbl.className = 'gallery-label';
    lbl.textContent = label;

    item.appendChild(img);
    item.appendChild(lbl);
    return item;
  }

  function addGalleryItem(item) {
    var grid = document.getElementById('gallery-grid');
    var empty = document.getElementById('gallery-empty');
    if (empty) {
      empty.remove();
    }
    grid.appendChild(item);
  }

  function loadGallery() {
    if (galleryLoaded) return;
    galleryLoaded = true;

    if (pendingGalleryImages.length > 0) {
      // SSE has already delivered images — just flush them, no fetch needed
      var batch = pendingGalleryImages.splice(0);
      batch.forEach(addGalleryItem);
    } else {
      // No SSE images yet — fetch from server
      fetch('/gallery').then(function(r) {
        return r.json();
      }).then(function(images) {
        if (!Array.isArray(images) || images.length === 0) return;
        var grid = document.getElementById('gallery-grid');
        var empty = document.getElementById('gallery-empty');
        if (empty) empty.remove();
        images.forEach(function(img) {
          grid.appendChild(makeGalleryItem(img.label, img.image_b64));
        });
      }).catch(function() {
        // Leave "No images yet" placeholder
      });
    }
  }
</script>

</body>
</html>
