<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Chotu</title>
  <link rel="stylesheet" href="/static/console.css">
</head>
<body>
  <main id="app">
    <!-- LEFT PANE : translator, its own orange -->
    <section id="lane-pane" class="lane-pane">
      <button id="gear" class="gear" aria-label="Settings" title="Settings">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M12 8.6a3.4 3.4 0 1 0 0 6.8 3.4 3.4 0 0 0 0-6.8Z" stroke="currentColor" stroke-width="1.8"/>
          <path d="M10.1 3.2 10.6 6l-.6.3a8.4 8.4 0 0 0-1.9 1.1l-.6-.2-2.1-1.2-1.6 2.8 1.9 1.3-.1.6a8.5 8.5 0 0 0 0 2.2l.1.6-1.9 1.4 1.6 2.8 2.1-1.2.6.2c.6.5 1.2.8 1.9 1.1l.6.3.5 2.8h3.8l.5-2.8.6-.3a8.4 8.4 0 0 0 1.9-1.1l.6.2 2.1 1.2 1.6-2.8-1.9-1.4.1-.6a8.5 8.5 0 0 0 0-2.2l-.1-.6 1.9-1.3-1.6-2.8-2.1 1.2-.6-.2a8.4 8.4 0 0 0-1.9-1.1l-.6-.3-.5-2.8h-3.8Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
        </svg>
      </button>

      <!-- Resting state (idle) -->
      <div id="resting" class="resting">
        <div class="resting-title">SELECT LANGUAGES,</div>
        <div class="resting-sub">PUSH TO TALK</div>
        <!-- The sphere is a first-use affordance only. On the phone the whole
             pane is the hold target, so this disc is purely visual there. -->
        <button id="talk" class="talk" aria-label="Hold to talk"></button>
        <span id="hint" class="mono hint-desktop">HOLD [Z] / [SPACE] TO TALK</span>
        <span class="mono hint-mobile">HOLD TO TALK</span>
      </div>

      <!-- Active state (after a take) -->
      <div id="active" class="active-panel" hidden>
        <div class="card">
          <div class="card-label mono" id="src-label">SOURCE</div>
          <div class="card-text" id="src-text"></div>
        </div>
        <div class="card">
          <div class="card-label mono" id="dst-label">TRANSLATION</div>
          <div class="card-text" id="dst-text"></div>
        </div>
        <div class="timing mono" id="timing"></div>
      </div>

      <!-- Numbered language lanes: select the SOURCE language -->
      <div id="lanes" class="lanes">
        <div class="lane selected" data-num="1">
          <span class="lane-num">1</span><span class="lane-name"></span>
        </div>
        <div class="lane" data-num="2">
          <span class="lane-num">2</span><span class="lane-name"></span>
        </div>
      </div>

      <!-- Settings panel (also holds the stop control) -->
      <div id="gear-panel" hidden>
        <div class="gear-head">
          <span class="mono gear-title">SETTINGS</span>
          <button id="gear-close" aria-label="Close settings">&#10005;</button>
        </div>
        <div class="gear-row"><span class="gear-label mono">model</span>
          <span id="gear-model" class="mono"></span></div>
        <div class="gear-row"><span class="gear-label mono">bridge</span>
          <span id="gear-bridge" class="mono"></span></div>
        <button id="stop" class="gear-stop" aria-label="Stop">STOP</button>
      </div>
    </section>

    <!-- RIGHT PANE : camera, full-bleed, single telemetry overlay top-left -->
    <section id="cam-pane" class="cam-pane">
      <img id="cam" alt="Chotu's camera" src="/stream">
      <div id="cam-offline">CAMERA OFFLINE</div>
      <div id="telemetry" class="telemetry">
        <div class="tel-row"><span class="tel-label">BATTERY:</span><span class="tel-value" id="battery-pct">--</span></div>
        <div class="tel-row"><span class="tel-label">VOLTAGE:</span><span class="tel-value" id="battery-volt">--</span></div>
      </div>
    </section>
  </main>
  <script type="module" src="/static/console.js"></script>
</body>
</html>
