<!DOCTYPE html>

  .ov{position:absolute;font-family:'JetBrains Mono',monospace}
  .leg.editing{outline:1px solid #37b6ff}
  .dot-ok{color:#4ec77f} .dot-clamp{color:#f2664f}

  button:disabled{opacity:.4;cursor:not-allowed}
  button.primary{background:#37b6ff;color:#06121d;border-color:#37b6ff}

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

<body>
<div class="app">
  <!-- TOP TOOLBAR -->
  <div class="toolbar">
    <div style="display:flex;align-items:center;gap:8px">
      <div style="width:22px;height:22px;border-radius:5px;background:linear-gradient(135deg,#37b6ff,#1d7fd0);display:flex;align-items:center;justify-content:center;color:#06121d;font-weight:700">◣</div>
      <span style="font-weight:700">CHOTU</span>
      <span style="font-size:11px;color:#6b7280;letter-spacing:.18em;font-family:'JetBrains Mono',monospace">ANIMATION&nbsp;STUDIO</span>
    </div>
    <div style="flex:1"></div>
    <div id="conn" style="color:#888;font-family:'JetBrains Mono',monospace;font-size:12px">● checking Pi…</div>
    <div style="flex:1"></div>
    <button onclick="resetToStand()">⟲ Reset to stand</button>
    <button class="primary needs-pi" onclick="sendToRobot()">▶ Send to robot</button>
  </div>

  <div class="mid">
    <!-- LEFT RAIL -->
    <div class="rail-l">
      <div style="font:600 11px 'JetBrains Mono';letter-spacing:.16em;color:#7d8694">LEG&nbsp;EDITOR</div>
      <div id="legEditor"></div>
      <div style="border-top:1px solid #20242d;padding-top:10px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
          <span style="font:600 11px 'JetBrains Mono';letter-spacing:.14em;color:#7d8694">SERVO&nbsp;SPEED</span>
          <span style="font-family:'JetBrains Mono',monospace;color:#5fc6ff" id="speedReadout">60<span style="color:#5b6470">/90</span></span>
        </div>
        <div id="speedBars" style="height:28px;display:flex;align-items:flex-end;gap:3px;margin-bottom:6px"></div>

    <!-- CENTER VIEWPORT -->

      <div id="threed"></div>
      <div class="ov" style="left:14px;top:12px">
        <div id="viewLabel" style="font-size:11px;color:#cdd6e0;letter-spacing:.12em">PERSPECTIVE</div>
        <div style="font-size:10px;color:#5b6470" id="viewSub">drag to pose</div>
      </div>
      <div class="ov" style="left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:4px;background:rgba(14,18,24,.82);border:1px solid #283041;border-radius:9px;padding:5px;font-size:11px">

    <!-- RIGHT RAIL -->

      <div>

        <canvas id="sideCanvas" width="260" height="220" style="width:100%;height:auto"></canvas>
      </div>
      <div id="exportPanel">

        desc <input id="desc" type="text" placeholder="A quick description." style="width:200px;margin-top:6px"><br>

        default_speed <input id="defaultSpeed" type="number" value="60" style="width:60px;margin-top:6px"><br>
        <div style="margin-top:8px;display:flex;gap:6px">
          <button class="primary" onclick="exportJSON()">⬇ Export</button>
          <button onclick="copyJSON()">⧉</button>

  <!-- TIMELINE -->

      <span style="flex:1"></span>
      <button onclick="playPreview()">▷ Play preview</button>
      <button class="primary needs-pi" onclick="playOnRobot()">▶▶ Play on robot</button>
    </div>
    <div id="timeline" style="flex:1;overflow-x:auto;white-space:nowrap"></div>
  </div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { TransformControls } from 'three/addons/controls/TransformControls.js';

const LEG_NAMES = ["FR · front-right", "FL · front-left", "RL · rear-left", "RR · rear-right"];
// Real picrawler stand (per-leg). The add-chotu-tool contract simplifies this to "[60,0,-30]
// each" but the actual stand frame is asymmetric per leg; the studio uses the real values.
const STAND = [[45,45,-50],[45,0,-50],[45,0,-50],[45,45,-50]];

// Single source of truth.
const state = {
  legs: STAND.map(l => l.slice()),  // current editable pose, 4x[x,y,z]
  speed: 60,
  editing: 1,                       // index of leg highlighted in the editor
  frames: [],                       // timeline: [{legs, speed, hold_s}]
  selectedFrame: null,
};

function setLeg(i, axis, val) {
  state.legs[i][axis] = Number(val);
  renderAll();
}

function resetToStand() {
  state.legs = STAND.map(l => l.slice());
  renderAll();
}

function renderLegEditor() {
  const el = document.getElementById("legEditor");
  el.innerHTML = state.legs.map((leg, i) => {
    const editing = i===state.editing;
    const card = editing
      ? "border:1px solid #37b6ff;border-radius:7px;background:linear-gradient(180deg,rgba(55,182,255,.10),rgba(55,182,255,.03));padding:9px 11px;margin-bottom:8px"
      : "border:1px solid #20252e;border-radius:7px;background:#12161c;padding:9px 11px;margin-bottom:8px";
    const [code, meta] = LEG_NAMES[i].split(' · ');
    return `<div class="leg" style="${card}" onclick="state.editing=${i};renderAll()">
      <div style="display:flex;align-items:center;gap:7px;margin-bottom:7px">
        <span id="dot${i}"></span>
        <span style="font-weight:600">${code}</span>
        <span style="font-size:10.5px;color:#6b7280;font-family:'JetBrains Mono',monospace">${meta||''}</span>
        <span style="flex:1"></span>
        <span id="status${i}" style="font-size:10px;font-family:'JetBrains Mono',monospace"></span>
      </div>
      <div style="display:flex;gap:6px">
        ${["X","Y","Z"].map((ax, a) =>
          `<div style="flex:1;display:flex;align-items:center;background:#0b0e13;border:1px solid #232934;border-radius:5px;overflow:hidden">
             <span style="width:24px;text-align:center;font:600 11px 'JetBrains Mono';color:#6b7280;border-right:1px solid #232934;padding:6px 0">${ax}</span>
             <input type="number" value="${leg[a]}" oninput="setLeg(${i},${a},this.value)" style="flex:1;min-width:0;border:none;background:none;text-align:right;padding:6px 7px">
           </div>`
        ).join("")}
      </div>
    </div>`;
  }).join("");
}

// ---- kinematics (mirror of scripts/kinematics_ref.py) ----
const A=48, B=78, C=33, LENGTH_SIDE=77;

function coord2polar(x, y, z) {
  let L = Math.sqrt(x*x + y*y + z*z);
  if (L === 0) L = 0.1;
  if (L < C) { const t = C/L; x*=t; y*=t; z*=t; }
  else if (L > (A+B+C)) { const t = (A+B+C)/L; x*=t; y*=t; z*=t; }
  const w = Math.sqrt(x*x + y*y);
  const v = w - C;
  let u = Math.sqrt(z*z + v*v);
  u = Math.max(30, Math.min(91.58, u));
  const beta  = Math.acos((B*B + A*A - u*u) / (2*B*A));
  const angle1 = Math.atan2(z, v);
  const angle2 = Math.acos((A*A + u*u - B*B) / (2*A*u));
  const alpha = angle2 + angle1;
  const gamma = Math.atan2(y, x);
  return [90 - alpha*180/Math.PI, beta*180/Math.PI - 90, -(gamma*180/Math.PI - 45)];
}

function isReachable(x, y, z) {
  const L = Math.sqrt(x*x + y*y + z*z);
  if (L === 0) return false;
  if (L < C || L > (A+B+C)) return false;
  const w = Math.sqrt(x*x + y*y), v = w - C;
  const u = Math.sqrt(z*z + v*v);
  if (u < 30 || u > 91.58) return false;
  // picrawler sends servos as [beta,alpha,gamma] but limit_angle unpacks (alpha,beta,gamma),
  // so the bounds are swapped vs coord2polar names: alpha in [-10,90], beta in [-90,90].
  const [al, be, ga] = coord2polar(x, y, z);
  return al>=-10 && al<=90 && be>=-90 && be<=90 && ga>=-60 && ga<=60;
}

// Joint positions in the leg's local vertical plane, for drawing the linkage. Mirrors
// coord2polar's L/u clamps so an out-of-range pose renders where the robot ACTUALLY goes
// (rigid A,B), not a stretched leg. R = radial dist from hip, Z = height; hip=(0,0), base=(C,0).
function legPlane(x, y, z) {
  let L = Math.sqrt(x*x + y*y + z*z); if (L === 0) L = 0.1;
  if (L < C) { const t = C/L; x*=t; y*=t; z*=t; }
  else if (L > (A+B+C)) { const t = (A+B+C)/L; x*=t; y*=t; z*=t; }
  const w = Math.sqrt(x*x + y*y);
  const angle1 = Math.atan2(z, w - C);
  const u = Math.min(Math.max(Math.sqrt((w-C)**2 + z*z), 30), 91.58);
  const theta = angle1 + Math.acos((A*A + u*u - B*B)/(2*A*u));
  return {
    kneeR: C + A*Math.cos(theta), kneeZ: A*Math.sin(theta),
    footR: C + u*Math.cos(angle1), footZ: u*Math.sin(angle1), baseR: C, baseZ: 0,
  };
}

function renderDots() {
  state.legs.forEach((leg, i) => {
    const ok = isReachable(leg[0], leg[1], leg[2]);
    const editing = i===state.editing;
    const color = editing ? "#37b6ff" : (ok ? "#4ec77f" : "#f2664f");
    const dot = document.getElementById("dot"+i);
    dot.textContent = "●"; dot.style.color = color;
    const st = document.getElementById("status"+i);
    if (st) {
      st.textContent = editing ? "● EDITING" : (ok ? "REACHABLE" : "⚠ WILL CLAMP");
      st.style.color = color;
    }
  });
}

function renderSide() {  // articulated linkage for the leg being edited
  const cv = document.getElementById("sideCanvas"), g = cv.getContext("2d");
  g.clearRect(0,0,cv.width,cv.height);
  const leg = state.legs[state.editing], p = legPlane(leg[0], leg[1], leg[2]);
  const ox = 40, oy = 50, s = 0.7;
  const P = (r,z) => [ox + r*s, oy - z*s];   // z up on screen
  const seg = (aR,aZ,bR,bZ,col) => { const [a0,a1]=P(aR,aZ),[b0,b1]=P(bR,bZ);
    g.strokeStyle=col; g.lineWidth=3; g.beginPath(); g.moveTo(a0,a1); g.lineTo(b0,b1); g.stroke(); };
  g.strokeStyle="#2a2a2a"; g.beginPath(); g.moveTo(0,oy); g.lineTo(cv.width,oy); g.stroke();
  seg(0,0, p.baseR,p.baseZ, "#556");   // C offset (hip at origin)
  seg(p.baseR,p.baseZ, p.kneeR,p.kneeZ, "#9ad");  // A
  seg(p.kneeR,p.kneeZ, p.footR,p.footZ, "#9ad");  // B
}

// ---- live 3D model + CAD-style drag-to-pose (three.js) ----
// Ported from scripts/studio_3d_prototype.html (validated). Reuses studio's IK helpers
// (coord2polar/isReachable/legPlane) and `state`; does NOT duplicate them.
const SILVER = 0xe2e5ea;  // white-steel grey

// Body corners + base yaw so legs splay to corners (display convention; calibrated so the real
// per-leg stand renders as a symmetric X-splay). Named CORNERS3D to avoid clashing with the 2D CORNERS.
const HALF_BODY = LENGTH_SIDE/2;
const CORNERS3D = [ {p:[ HALF_BODY,0, HALF_BODY], yaw:Math.PI*0.5 },   // FR
                    {p:[-HALF_BODY,0, HALF_BODY], yaw:Math.PI*0.75},   // FL
                    {p:[-HALF_BODY,0,-HALF_BODY], yaw:Math.PI*1.25},   // RL
                    {p:[ HALF_BODY,0,-HALF_BODY], yaw:Math.PI*2.0 } ]; // RR

let scene, camera, renderer, controls, legGroups, gizmoTarget, tcontrols;
let dragging = false, threeReady = false, gizmoOn = true, freeDragging = false;

function init3D() {
  const host = document.getElementById("threed");
  scene = new THREE.Scene(); scene.background = new THREE.Color(0x10131a);
  const sizeOf = () => {
    const r = host.getBoundingClientRect();
    return { w: Math.max(1, Math.floor(r.width)), h: Math.max(1, Math.floor(r.height)) };
  };
  let { w, h } = sizeOf();
  camera = new THREE.PerspectiveCamera(48, w/h, 1, 4000);
  camera.position.set(220,180,260);
  renderer = new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(w, h); host.appendChild(renderer.domElement);
  const ro = new ResizeObserver(() => {
    const s = sizeOf();
    camera.aspect = s.w / s.h; camera.updateProjectionMatrix();
    renderer.setSize(s.w, s.h);
  });
  ro.observe(host);
  controls = new OrbitControls(camera, renderer.domElement);
  controls.enablePan = true; controls.enableZoom = true; controls.screenSpacePanning = true;
  controls.target.set(0,-20,0);
  scene.add(new THREE.AmbientLight(0xffffff,0.7));
  const dl = new THREE.DirectionalLight(0xffffff,0.7); dl.position.set(120,200,120); scene.add(dl);
  const grid = new THREE.GridHelper(400,16,0x2a3744,0x202833); grid.position.y=-95; scene.add(grid);
  scene.add(new THREE.AxesHelper(40));

  // body — silver chassis plate + dark Pi/board stack on top
  const body = new THREE.Mesh(new THREE.BoxGeometry(LENGTH_SIDE*1.15,12,LENGTH_SIDE*1.05),
    new THREE.MeshStandardMaterial({color:SILVER, metalness:.55, roughness:.45}));
  scene.add(body);
  const board = new THREE.Mesh(new THREE.BoxGeometry(LENGTH_SIDE*0.8,14,LENGTH_SIDE*0.7),
    new THREE.MeshStandardMaterial({color:0x16321f, metalness:.2, roughness:.7}));
  board.position.y=12; scene.add(board);
  // nose marker (front = +Z): cone + two ultrasonic "eyes"
  const nose = new THREE.Mesh(new THREE.ConeGeometry(7,14,4),
    new THREE.MeshBasicMaterial({color:0x556})); nose.rotation.x=Math.PI/2;
  nose.position.set(0,0,LENGTH_SIDE*0.55); scene.add(nose);
  [-8,8].forEach(dx=>{ const eye=new THREE.Mesh(new THREE.CylinderGeometry(5,5,4,16),
    new THREE.MeshStandardMaterial({color:0x2a2d33})); eye.rotation.x=Math.PI/2;
    eye.position.set(dx,-2,LENGTH_SIDE*0.5); scene.add(eye); });

  // Kinematic skeleton: plate bones for C hip-link + A thigh, a triangular blade for B lower-leg,
  // dark servo markers at the 3 actuated joints.
  const plateMat = () => new THREE.MeshStandardMaterial({color:SILVER, metalness:.55, roughness:.4});
  const mkPlate = (width) => new THREE.Mesh(new THREE.BoxGeometry(width,1,3), plateMat());
  const mkBlade = () => { // unit-length triangle: base (width 26) at y=0, tip at y=-1; scaled per-frame
    const s=new THREE.Shape(); s.moveTo(-13,0); s.lineTo(13,0); s.lineTo(0,-1); s.closePath();
    const g=new THREE.ExtrudeGeometry(s,{depth:2.5,bevelEnabled:false}); g.translate(0,0,-1.25);
    return new THREE.Mesh(g, new THREE.MeshStandardMaterial({color:SILVER, metalness:.55, roughness:.45, side:THREE.DoubleSide}));
  };
  const mkServo = () => new THREE.Mesh(new THREE.BoxGeometry(9,9,15),
    new THREE.MeshStandardMaterial({color:0x8b9099, metalness:.35, roughness:.6}));
  legGroups = CORNERS3D.map((_,i)=>{
    const hipBone=mkPlate(11), upper=mkPlate(13), blade=mkBlade();
    const sv=[mkServo(),mkServo(),mkServo()];  // yaw(gamma), thigh(alpha), knee(beta)
    [hipBone,upper,blade,...sv].forEach(m=>{ m.userData.legIndex=i; scene.add(m); });
    return { hipBone, upper, blade, sv };
  });

  // --- CAD-style drag-to-pose: a TransformControls gizmo on the edited leg's foot ---
  gizmoTarget = new THREE.Object3D(); scene.add(gizmoTarget);
  tcontrols = new TransformControls(camera, renderer.domElement);
  tcontrols.setSize(0.7); tcontrols.attach(gizmoTarget); scene.add(tcontrols);
  tcontrols.addEventListener('dragging-changed', e=>{ dragging=e.value; controls.enabled=!e.value; });
  tcontrols.addEventListener('objectChange', ()=>{
    if(!dragging) return;                       // ignore our own programmatic repositioning
    const i=state.editing, c=CORNERS3D[i];
    const rel=gizmoTarget.position.clone().sub(new THREE.Vector3(...c.p));  // world -> leg-local
    const w=Math.hypot(rel.x, rel.z), la=c.yaw - Math.atan2(rel.z, rel.x);
    state.legs[i]=[ Math.round(w*Math.cos(la)), Math.round(w*Math.sin(la)), Math.round(rel.y) ];
    renderAll();
  });

  // --- leg-pick (click) + free foot-drag (gizmo OFF) ---
  const picker = new THREE.Raycaster();
  const pndc = new THREE.Vector2();
  const dragPlane = new THREE.Plane();
  let downX=0, downY=0, freeMoved=false;
  const toNDC = (e) => {
    const r = renderer.domElement.getBoundingClientRect();
    pndc.x = ((e.clientX-r.left)/r.width)*2 - 1;
    pndc.y = -((e.clientY-r.top)/r.height)*2 + 1;
  };

  renderer.domElement.addEventListener('pointerdown', e=>{
    downX=e.clientX; downY=e.clientY; freeMoved=false;
    if(gizmoOn) return;                          // gizmo handles its own drags
    // start a free-drag only if the press lands near the edited foot (screen space)
    const foot = gizmoTarget.position.clone();
    const sc = foot.clone().project(camera);
    toNDC(e);
    if(Math.hypot(sc.x-pndc.x, sc.y-pndc.y) > 0.06) return;  // else let OrbitControls/pick handle it
    dragPlane.setFromNormalAndCoplanarPoint(
      camera.getWorldDirection(new THREE.Vector3()).negate(), foot);
    freeDragging = true; controls.enabled = false;
    e.target.setPointerCapture?.(e.pointerId);
  });

  renderer.domElement.addEventListener('pointermove', e=>{
    if(!freeDragging) return;
    freeMoved = true;
    toNDC(e); picker.setFromCamera(pndc, camera);
    const hit = new THREE.Vector3();
    if(!picker.ray.intersectPlane(dragPlane, hit)) return;
    const i=state.editing, c=CORNERS3D[i];
    const rel=hit.clone().sub(new THREE.Vector3(...c.p));
    const w=Math.hypot(rel.x, rel.z), la=c.yaw - Math.atan2(rel.z, rel.x);
    state.legs[i]=[ Math.round(w*Math.cos(la)), Math.round(w*Math.sin(la)), Math.round(rel.y) ];
    renderAll();
  });

  const endFree = ()=>{ if(freeDragging){ freeDragging=false; controls.enabled=true; } };
  renderer.domElement.addEventListener('pointercancel', endFree);
  renderer.domElement.addEventListener('pointerup', e=>{
    const wasFree = freeDragging; endFree();
    if(dragging) return;                                   // gizmo drag, not a click
    if(wasFree && freeMoved) return;                       // a free-drag, not a select-click
    if(Math.hypot(e.clientX-downX, e.clientY-downY) > 5) return;  // orbit/pan drag
    toNDC(e); picker.setFromCamera(pndc, camera);
    const meshes = legGroups.flatMap(g=>[g.hipBone, g.upper, g.blade, ...g.sv]);
    const hit = picker.intersectObjects(meshes, false)[0];
    if(hit && hit.object.userData.legIndex !== undefined){
      state.editing = hit.object.userData.legIndex; renderAll();
    }
  });

  threeReady = true;
  (function loop(){ requestAnimationFrame(loop); controls.update(); renderer.render(scene,camera); })();
}

function placeBone(bone, a, b){ // position a plate between two Vector3
  const dir=new THREE.Vector3().subVectors(b,a); const len=dir.length();
  bone.scale.set(1,len,1);
  bone.position.copy(a).add(b).multiplyScalar(0.5);
  bone.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), dir.clone().normalize());
}

function render3D(){
  if(!threeReady) return;  // renderAll() runs once before init; no-op until the scene exists
  state.legs.forEach((leg,i)=>{
    const [x,y,z]=leg; const pl=legPlane(x,y,z);
    const corner=CORNERS3D[i]; const worldYaw=corner.yaw-Math.atan2(y,x);
    const dir=new THREE.Vector3(Math.cos(worldYaw),0,Math.sin(worldYaw));
    const base=new THREE.Vector3(...corner.p);
    const P=(r,zz)=>base.clone().addScaledVector(dir,r).add(new THREE.Vector3(0,zz,0));
    const hip=P(0,0), kneeBase=P(C,0), knee=P(pl.kneeR,pl.kneeZ), foot=P(pl.footR,pl.footZ);
    const grp=legGroups[i];
    placeBone(grp.hipBone, hip, kneeBase);   // C: hip link (body -> shoulder)
    placeBone(grp.upper, kneeBase, knee);    // A: thigh (shoulder -> knee)
    // B: lower leg as the triangular blade, base at the knee, tip at the foot (ground contact)
    const bladeDir=new THREE.Vector3().subVectors(knee, foot);  // base->tip points knee->foot
    grp.blade.position.copy(knee);
    grp.blade.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), bladeDir.clone().normalize());
    grp.blade.scale.set(1, bladeDir.length(), 1);
    // servo markers at the 3 actuated joints (kinematic, not CAD-exact bodies)
    grp.sv[0].position.copy(hip);       // yaw  (gamma)
    grp.sv[1].position.copy(kneeBase);  // thigh (alpha)
    grp.sv[2].position.copy(knee);      // knee  (beta)
    const ok=isReachable(x,y,z);
    const col=(i===state.editing)?0x37b6ff:(ok?0x4ec77f:0xf2664f);
    grp.upper.material.color.setHex(col); grp.blade.material.color.setHex(col);
    grp.hipBone.material.color.setHex(i===state.editing?0x37b6ff:(ok?0x4ec77f:0xf2664f));
    if(i===state.editing && !dragging && !freeDragging) gizmoTarget.position.copy(foot);  // park gizmo on edited foot
  });
}

function addFrame() {
  state.frames.push({legs: state.legs.map(l=>l.slice()), speed: state.speed, hold_s: 0});
  state.selectedFrame = state.frames.length-1; renderAll();
}
function dupFrame(i){ const f=state.frames[i];
  state.frames.splice(i+1,0,{legs:f.legs.map(l=>l.slice()),speed:f.speed,hold_s:f.hold_s}); renderAll(); }
function delFrame(i){ state.frames.splice(i,1); state.selectedFrame=null; renderAll(); }
function moveFrame(i,d){ const j=i+d; if(j<0||j>=state.frames.length) return;
  [state.frames[i],state.frames[j]]=[state.frames[j],state.frames[i]]; renderAll(); }
function loadFrame(i){ const f=state.frames[i];
  state.legs=f.legs.map(l=>l.slice()); state.speed=f.speed;
  document.getElementById("speed").value=f.speed; state.selectedFrame=i; renderAll(); }
function setHold(i,v){ state.frames[i].hold_s=Number(v); }
function setFrameSpeed(i,v){ state.frames[i].speed=Number(v); }

function renderTimeline() {
  const el = document.getElementById("timeline");
  el.innerHTML = state.frames.map((f,i)=>`
    <span class="${i===state.selectedFrame?'editing':''}" style="border:1px solid #333;padding:6px;margin:2px;display:inline-block">
      <b onclick="loadFrame(${i})" style="cursor:pointer">F${i+1}</b>
      spd <input type="number" value="${f.speed}" style="width:48px" oninput="setFrameSpeed(${i},this.value)">
      hold <input type="number" step="0.1" value="${f.hold_s}" style="width:48px" oninput="setHold(${i},this.value)">
      <button onclick="moveFrame(${i},-1)">◀</button><button onclick="moveFrame(${i},1)">▶</button>
      <button onclick="dupFrame(${i})">⧉</button><button onclick="delFrame(${i})">🗑</button>
    </span>`).join(" → ") +
    `<div style="margin-top:6px"><button onclick="addFrame()">＋ Add frame</button></div>`;
}

const sleep = ms => new Promise(r=>setTimeout(r,ms));
async function playPreview() {
  for (const f of state.frames) {
    state.legs = f.legs.map(l=>l.slice()); renderAll();
    await sleep(700 + f.hold_s*1000);  // ~servo travel + hold, visual only
  }
}
async function playOnRobot() {  // mirrors the generated _play_{tool} body
  for (const f of state.frames) {
    await fetch("/set_legs", {method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({legs: f.legs, speed: f.speed})});
    if (f.hold_s) await sleep(f.hold_s*1000);
  }
}

// ---- export panel ----
const SNAKE = /^[a-z][a-z0-9_]*$/;

function buildExport() {
  return {
    tool: document.getElementById("toolName").value.trim(),
    description: document.getElementById("desc").value.trim(),
    persona_gated: document.getElementById("personaGated").checked,
    default_speed: Number(document.getElementById("defaultSpeed").value),
    frames: state.frames.map(f => ({legs: f.legs, speed: f.speed, hold_s: f.hold_s})),
  };
}

function validateExport(d) {
  if (!SNAKE.test(d.tool)) return "tool must be snake_case";
  if (!d.frames.length) return "need at least 1 frame";
  for (const f of d.frames) {
    if (!Array.isArray(f.legs) || f.legs.length !== 4) return "each frame needs 4 legs";
    if (f.legs.some(l => !Array.isArray(l) || l.length !== 3)) return "each leg is [x,y,z]";
  }
  return null;
}

function renderExportStatus() {
  const err = validateExport(buildExport());
  const el = document.getElementById("exportStatus");
  el.textContent = err ? "✗ " + err : `✓ ${state.frames.length} frame(s) valid`;
  el.style.color = err ? "#ff5b5b" : "#3ddc6f";
}

function exportJSON() {
  const d = buildExport(); const err = validateExport(d);
  if (err) { alert("Cannot export: " + err); return; }
  const blob = new Blob([JSON.stringify(d, null, 2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = d.tool + ".json"; a.click();
}

async function copyJSON() {
  const d = buildExport(); const err = validateExport(d);
  if (err) { alert("Cannot copy: " + err); return; }
  await navigator.clipboard.writeText(JSON.stringify(d, null, 2));
}

function loadJSON(file) {
  const reader = new FileReader();
  reader.onload = () => {
    const d = JSON.parse(reader.result);
    document.getElementById("toolName").value = d.tool || "";
    document.getElementById("desc").value = d.description || "";
    document.getElementById("personaGated").checked = !!d.persona_gated;
    document.getElementById("defaultSpeed").value = d.default_speed ?? 60;
    state.frames = (d.frames || []).map(f => ({legs: f.legs.map(l=>l.slice()), speed: f.speed, hold_s: f.hold_s}));
    state.selectedFrame = null; renderAll();
  };
  reader.readAsText(file);
}

function onSpeedInput(){
  document.getElementById("speedReadout").innerHTML =
    `${document.getElementById("speed").value}<span style="color:#5b6470">/90</span>`;
  renderAll();
}

function renderSpeedBars(){
  const host=document.getElementById("speedBars"); if(!host) return;
  const v=Number(document.getElementById("speed").value);
  const filled=Math.round(v/90*12);
  host.innerHTML="";
  for(let i=0;i<12;i++){
    const b=document.createElement("div");
    b.style.cssText=`flex:1;height:${28+i*6}%;border-radius:1px;cursor:pointer;background:${i<filled?'#37b6ff':(i<filled+3?'#22323f':'#1c2630')}`;
    b.onclick=()=>{document.getElementById("speed").value=Math.round((i+1)/12*90);onSpeedInput();};
    host.appendChild(b);
  }
}

// renderAll() is extended by later tasks (previews, export, timeline).
function renderAll() {
  state.speed = Number(document.getElementById("speed").value);
  renderSpeedBars();
  renderLegEditor();
  renderDots();
  renderSide();
  render3D();
  renderTimeline();
  renderExportStatus();
}

async function sendToRobot() {
  try {
    const r = await fetch("/set_legs", {method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({legs: state.legs, speed: state.speed})});
    const j = await r.json();
    if (!j.ok) alert("Pi error: " + (j.error || JSON.stringify(j)));
  } catch (e) { alert("Send failed: " + e); }
}

async function pollHealth() {
  const el = document.getElementById("conn");
  try {
    const r = await fetch("/health");
    const ok = r.ok && (await r.json()).ok;
    el.textContent = ok ? "● Pi connected" : "● Pi unreachable";
    el.style.color = ok ? "#4ec77f" : "#f2664f";
    document.querySelectorAll(".needs-pi").forEach(b => b.disabled = !ok);
  } catch { el.textContent = "● Pi unreachable"; el.style.color = "#f2664f";
    document.querySelectorAll(".needs-pi").forEach(b => b.disabled = true); }
}

// ---- camera view presets (snap the real camera) ----
const VIEWS = {
  PERSP: { pos:[220,180,260], target:[0,-20,0], label:"PERSPECTIVE" },
  TOP:   { pos:[0,360,0.1],   target:[0,-20,0], label:"TOP VIEW" },
  SIDE:  { pos:[360,0,0],     target:[0,-20,0], label:"SIDE VIEW" },
  FRONT: { pos:[0,0,360],     target:[0,-20,0], label:"FRONT VIEW" },
};
function setView(v){
  const cfg = VIEWS[v]; if(!cfg || !camera) return;
  camera.position.set(...cfg.pos);
  controls.target.set(...cfg.target); controls.update();
  document.getElementById("viewLabel").textContent = cfg.label;
  document.querySelectorAll(".viewbtn").forEach(b=>{
    const on = b.dataset.view===v;
    b.style.cssText = on
      ? "padding:6px 11px;border-radius:6px;background:#37b6ff;color:#06121d;font-weight:700;cursor:pointer"
      : "padding:6px 11px;border-radius:6px;color:#aab2bd;cursor:pointer";
  });
}
window.setView = setView;

function toggleGizmo(){
  gizmoOn = !gizmoOn;
  if(tcontrols){ tcontrols.visible = gizmoOn; tcontrols.enabled = gizmoOn; }
  const btn = document.getElementById("gizmoBtn");
  if(btn) btn.style.color = gizmoOn ? "#37b6ff" : "#aab2bd";
  document.getElementById("viewSub").textContent = gizmoOn ? "drag to pose" : "free-drag foot";
}
window.toggleGizmo = toggleGizmo;

// Inline HTML handlers call these by global name; the module scope is not global, so expose them.
window.state = state;
window.renderAll = renderAll;
window.onSpeedInput = onSpeedInput;
window.setLeg = setLeg;
window.resetToStand = resetToStand;
window.sendToRobot = sendToRobot;
window.addFrame = addFrame; window.dupFrame = dupFrame; window.delFrame = delFrame;
window.moveFrame = moveFrame; window.loadFrame = loadFrame;
window.setHold = setHold; window.setFrameSpeed = setFrameSpeed;
window.playPreview = playPreview; window.playOnRobot = playOnRobot;
window.exportJSON = exportJSON; window.copyJSON = copyJSON; window.loadJSON = loadJSON;
window.renderExportStatus = renderExportStatus;

setInterval(pollHealth, 4000); pollHealth();

renderAll();
init3D();   // scene-init runs ONCE, after the first renderAll()
render3D(); // first 3D draw now that the scene exists
setView("PERSP"); // set initial active view-button state
</script>
</body>
</html>
